[package]
name = "nullapt-sdk"
version = "0.1.0"
edition = "2021"
description = "Rust SDK for building nullapt WASM skills"
license = "MIT"
repository = "https://github.com/nullapt/sdk"
keywords = ["nullapt", "wasm", "mcp", "ai", "skills"]
categories = ["wasm", "api-bindings"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
extism-pdk = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
extism = "1"
